AllCops:
  NewCops: enable
  TargetRubyVersion: 3.3
  SuggestExtensions: false
  # Setting `Exclude` here *replaces* RuboCop's default list rather than
  # merging with it, so these have to be restated or RuboCop walks into
  # vendored gem sources and loads their own configs — which is how CI ended
  # up trying to require `rubocop-rspec` out of hashdiff's .rubocop.yml.
  Exclude:
    - 'node_modules/**/*'
    - 'tmp/**/*'
    - 'vendor/**/*'
    - '.git/**/*'
    # The dummy host app is a `rails new` skeleton, generated code that exists
    # only to be mounted into. Linting it would be auditing Rails' own output.
    - 'dummy/**/*'

Gemspec/DevelopmentDependencies:
  Enabled: false

# A Rails engine's whole point is host compatibility, so an unambiguous
# `namespace` is part of the public contract.
Style/Documentation:
  Enabled: false

# `name` is a DSL on Omnisearch::Provider that shadows Class#name, which is
# confusing to read. The alias is deliberate and documented at the definition.
Naming/MethodName:
  Exclude:
    - lib/omnisearch/provider.rb

# `lib/omnisearch.rb` is the gem's entry point: the module, its two errors and
# the module-level config API. Splitting that across files would mean requiring
# a config file to get a config API.
Style/OneClassPerFile:
  Exclude:
    - lib/omnisearch.rb

# Tests read better as a single linear narrative than split across helpers, and
# the handful that run a couple of lines over are short enough to scan.
Metrics/MethodLength:
  Max: 15

# A gemspec is a declaration block; splitting it defeats the point. Tests read
# better as one linear narrative than split across helpers.
Metrics/BlockLength:
  Exclude:
    - '*.gemspec'
    - 'test/**/*'
